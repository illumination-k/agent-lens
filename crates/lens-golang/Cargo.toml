[package]
name = "lens-golang"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lens-domain = { path = "../lens-domain", version = "0.5.0" }
thiserror = { workspace = true }
tracing = { workspace = true }
tree-sitter = "0.26"
# Pinned to the crates.io release: Go 1.27's `new(expr)` does not parse
# until upstream tree-sitter-go covers it (issue #494). Such a file is
# warned about and skipped rather than failing the run.
tree-sitter-go = "0.25"

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
