# Pinned OSS projects the call-graph accuracy benchmark runs on.
# See docs/callgraph-accuracy.md. `commit` is the full SHA the tag resolved to
# (`git ls-remote <repo> refs/tags/<tag>`); the tag is kept for humans only.
#
# Keys:
#   name      directory under target/callgraph-accuracy/, and the key
#             adjudications.toml entries are filed under
#   language  go | python | rust | typescript
#   oracle    go-vta | python-setprofile | rust-analyzer | typescript-checker
#   repo      git URL
#   tag       release tag `commit` was resolved from (informational)
#   commit    full commit SHA that is checked out
#   subdir    optional: analyse only this directory of the checkout
#   install   python only: extra pip requirements next to the editable install
#   pytest    python only: arguments passed to pytest under the oracle
#   features  rust only: cargo features rust-analyzer enables (default: all)

[[target]]
name = "pflag"
language = "go"
oracle = "go-vta"
repo = "https://github.com/spf13/pflag"
tag = "v1.0.10"
commit = "0491e5702ad2bb108bc519a5221bcc0f52aa9564"

[[target]]
name = "go-cmp"
language = "go"
oracle = "go-vta"
repo = "https://github.com/google/go-cmp"
tag = "v0.7.0"
commit = "9b12f366a942ebc7254abc7f32ca05068b455fb7"

[[target]]
name = "more-itertools"
language = "python"
oracle = "python-setprofile"
repo = "https://github.com/more-itertools/more-itertools"
tag = "v11.1.0"
commit = "64be96ceb2a6e836f76f069f4a96d2394d59fd0c"
install = ["pytest"]
# test_concurrent_consumers runs 100 threads over 10**5 items: ~50 s plain,
# ~7 min under the profiler, for a handful of edges the other concurrent_tee
# tests also produce.
pytest = [
  "-q",
  "-p",
  "no:cacheprovider",
  "tests",
  "--deselect",
  "tests/test_more.py::TestConcurrentTee::test_concurrent_consumers",
]

[[target]]
name = "toolz"
language = "python"
oracle = "python-setprofile"
repo = "https://github.com/pytoolz/toolz"
tag = "1.1.0"
commit = "568c2b8393973cd172a466546c9d95779c452438"
install = ["pytest"]
# test_has_version reads the version from git tags, which a shallow checkout
# at a pinned commit does not have.
pytest = ["-q", "-p", "no:cacheprovider", "toolz", "--deselect", "toolz/tests/test_package.py::test_has_version"]

[[target]]
name = "semver"
language = "rust"
oracle = "rust-analyzer"
repo = "https://github.com/dtolnay/semver"
tag = "1.0.28"
commit = "5368cdfc013f90a4ecb686a013374a651a846e0e"

[[target]]
name = "log"
language = "rust"
oracle = "rust-analyzer"
repo = "https://github.com/rust-lang/log"
tag = "0.4.34"
commit = "8034743dd9d7f7583bd9a670271483d176130911"
# Not all features: the max_level_* / release_max_level_* features are
# mutually exclusive and would switch off the integration test's body.
features = ["kv_serde", "kv_sval"]

[[target]]
name = "neverthrow"
language = "typescript"
oracle = "typescript-checker"
repo = "https://github.com/supermacro/neverthrow"
tag = "v8.2.0"
commit = "1b7a959dc83593de12b646565dfddc08bd1ed561"

[[target]]
name = "zustand"
language = "typescript"
oracle = "typescript-checker"
repo = "https://github.com/pmndrs/zustand"
tag = "v5.0.15"
commit = "2115efb9e270e73ad1d3472dfe0e0c7b8c6abcd4"
