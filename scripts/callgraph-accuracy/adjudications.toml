# toolz: a call through a local, a parameter or a loop variable is bound to
# a same-named function or method elsewhere (the name is shadowed).
[[adjudication]]
target = "toolz"
caller = "toolz::tests::test_functoolz::test_curry_simple"
callee = "toolz::tests::test_functoolz::double"
verdict = "agent_lens_wrong"
note = "tests/test_functoolz.py:196 `double(10)` calls the local `double = cmul(2)` (a curry object), which shadows the module-level def"

[[adjudication]]
