# Human verdicts on edges where agent-lens and an oracle disagree
# (docs/callgraph-accuracy.md, "Adjudication"). Reused on every run.
#
# One [[adjudication]] per (target, caller, callee), keyed by agent-lens
# qualified names so a verdict survives line shifts. Copy the `toml` snippet
# of an entry in target/callgraph-accuracy/results/<target>/disagreements.json
# and fill in:
#   verdict = "oracle_wrong"      the oracle is corrected: an agent-lens-only
#                                 edge counts as a TP, an oracle-only edge is
#                                 dropped
#           | "agent_lens_wrong"  confirmed resolver bug; numbers unchanged
#           | "definition_gap"    the edge definition does not decide it; the
#                                 edge leaves both sides
#   note    = why, with the call site, so the next reader need not re-derive it
# A verdict that matches no current disagreement is reported as stale.

# pflag: `(expr).String()` on a parenthesised receiver is read as a bare call
# to the package-level `String` function.
[[adjudication]]
target = "pflag"
caller = "pflag::durationValue::String"
callee = "pflag::String"
verdict = "agent_lens_wrong"
note = "duration.go:25 `(*time.Duration)(d).String()` is time.Duration.String (stdlib), not pflag.String"

