[tools]
node = "25.9.0"
pnpm = "11.0.1"

# Every other web task depends on this: on a fresh checkout `web/node_modules`
# does not exist yet, and `pnpm exec oxlint` would fail before linting anything.
# It is not `sources`/`outputs` cached on purpose — a skipped install after a
# manually removed `node_modules` is a worse failure than a redundant one.
[tasks."install:ts"]
description = "Install the web dependencies from the lockfile"
run = "pnpm --dir web install --frozen-lockfile"

[tasks."fmt:ts"]
description = "Format with oxfmt"
depends = ["install:ts"]

run = "pnpm --dir web exec oxfmt --write src"

[tasks."lint:ts"]
description = "Lint and type-check TypeScript"
depends = ["install:ts"]

run = ["pnpm --dir web exec oxlint -c oxlint.config.ts .", "pnpm --dir web exec tsc --noEmit"]

[tasks."test:ts"]
description = "Run tests with vitest"
depends = ["install:ts"]

run = "pnpm --dir web exec vitest run"

# Separate from `test:ts` so the fast local loop stays instrumentation-free.
# CI runs this one and uploads `web/coverage/lcov.info` under the `web` flag.
[tasks."test:ts:coverage"]
description = "Run tests with vitest and emit an lcov coverage report"
depends = ["install:ts"]

run = "pnpm --dir web exec vitest run --coverage"

# The Pages deploy builds the same way (`pages.yml`), and its prerender runs
# with `failOnError: true`. Building here is what keeps a broken build from
# merging green and only surfacing on the deploy. The function-graph JSON is
# not generated: `readGraphReportFromDisk` returns `null` when it is absent,
# so the build stays Rust-free and the TS job needs no Rust toolchain.
[tasks."build:ts"]
description = "Build the web app, including the prerender pass"
depends = ["install:ts"]

run = "pnpm --dir web run build"

# The opencode plugin is a single dependency-free file that opencode loads
# as-is, so it has no package of its own: it borrows the web toolchain for
# formatting, linting, and type-checking, and its tests run on `node --test`
# (Node strips the types natively).
[tasks."fmt:opencode"]
description = "Format the opencode plugin with oxfmt"
depends = ["install:ts"]
dir = "integrations/opencode"
run = "../../web/node_modules/.bin/oxfmt --write ."

[tasks."lint:opencode"]
description = "Lint and type-check the opencode plugin"
depends = ["install:ts"]
dir = "integrations/opencode"
run = [
  "../../web/node_modules/.bin/oxfmt --check .",
  "../../web/node_modules/.bin/oxlint -c ../../web/oxlint.config.ts .",
  "../../web/node_modules/.bin/tsc --noEmit -p tsconfig.json",
]

[tasks."test:opencode"]
description = "Run the opencode plugin tests"
run = "node --test integrations/opencode/agent-lens.test.ts"

[tasks."ci:ts"]
description = "Run TypeScript lint, type-check, test, and build tasks"
depends = ["lint:ts", "test:ts", "build:ts", "lint:opencode", "test:opencode"]
