[tools]
rust = { version = "1.97.1", profile = "default", components = "rustfmt,clippy,llvm-tools-preview" }
"aqua:cargo-bins/cargo-binstall" = "1.18.1"

[tools."cargo:cargo-nextest"]
version = "0.9.132"
depends = ["aqua:cargo-bins/cargo-binstall"]

[tools."cargo:cargo-deny"]
version = "0.19.0"
depends = ["aqua:cargo-bins/cargo-binstall"]

[tools."cargo:cargo-audit"]
version = "0.22.1"
depends = ["aqua:cargo-bins/cargo-binstall"]

[tools."cargo:cargo-mutants"]
version = "27.0.0"
depends = ["aqua:cargo-bins/cargo-binstall"]

[tools."cargo:cargo-llvm-cov"]
version = "0.6.21"
depends = ["aqua:cargo-bins/cargo-binstall"]

[tasks."fmt:rust"]
description = "Format Rust code with cargo fmt"
run = "cargo fmt --all"

[tasks."lint:rust"]
description = "Lint Rust with clippy, fmt check, cargo-deny, cargo-audit"
run = [
  "cargo clippy --all-targets --all-features -- -D warnings",
  "cargo fmt --all --check",
  "cargo deny check",
  "cargo audit",
]

[tasks."test:rust"]
description = "Run Rust tests with cargo-nextest"
run = "cargo nextest run --locked --all-features"

[tasks."test:rust:doc"]
description = "Run Rust doctests (cargo-nextest does not run them)"
run = "cargo test --doc --locked --all-features --workspace"

[tasks."bench:rust"]
description = "Run the Criterion benchmarks; save or compare a named baseline"
usage = '''
flag "--save-baseline <name>" help="Store this run under a Criterion baseline name (convention: 'base' before a change, 'change' after)"
flag "--baseline <name>" help="Compare this run against a previously saved Criterion baseline"
'''
run = '''
set -eu
set --
if [ -n "${usage_save_baseline:-}" ]; then
  set -- "$@" --save-baseline "$usage_save_baseline"
fi
if [ -n "${usage_baseline:-}" ]; then
  set -- "$@" --baseline "$usage_baseline"
fi
cargo bench --workspace --all-features -- "$@"
'''

# Lives here rather than in `.mise.toml` so it resolves only where its dependency
# does, and is not a `mutants:*` glob: that would also pull in the diff-scoped
# run, which is the task you want on its own during normal development.
[tasks.mutants]
description = "Run the full-workspace mutation test (slow; not part of ci)"
depends = "mutants:rust"

[tasks."mutants:rust"]
description = "Run cargo-mutants across the whole workspace (very slow; not part of ci)"
usage = '''
flag "-j --jobs <jobs>" help="Number of cargo-mutants jobs to run in parallel" default="2"
'''
run = '''
set -eu
jobs="${usage_jobs:-2}"
case "$jobs" in
  ''|*[!0-9]*|0)
    echo "--jobs must be a positive integer."
    exit 1
    ;;
esac
cargo mutants --workspace --no-shuffle --jobs "$jobs"
'''

[tasks."mutants:rust:diff"]
description = "Run cargo-mutants only on Rust lines changed vs a base git ref (default: main)"
usage = '''
arg "[base]" help="Base git ref or revspec for git diff" default="main"
flag "-j --jobs <jobs>" help="Number of cargo-mutants jobs to run in parallel" default="2"
'''
run = '''
set -eu
base="${usage_base:-main}"
jobs="${usage_jobs:-2}"
case "$jobs" in
  ''|*[!0-9]*|0)
    echo "--jobs must be a positive integer."
    exit 1
    ;;
esac
if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
  if git rev-parse --verify "origin/$base" >/dev/null 2>&1; then
    base="origin/$base"
  elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
    base="HEAD~1"
  else
    echo "Could not resolve base ref '$base' (or origin/$base) and no HEAD~1 exists."
    exit 1
  fi
fi
mkdir -p target
git diff "$base" -- '*.rs' > target/mutants-diff.patch
if [ ! -s target/mutants-diff.patch ]; then
  echo "No Rust diff for cargo-mutants (base: $base)"
  exit 0
fi
echo "Running cargo-mutants against diff base: $base"
cargo mutants --workspace --no-shuffle --iterate --jobs "$jobs" --in-diff target/mutants-diff.patch
'''

[tasks."ci:rust"]
description = "Run Rust lint and test tasks"
depends = ["lint:rust", "test:rust", "test:rust:doc"]

# Dogfooding: run the freshly built binary over this repository's own
# sources, driving the profiles in `agent-lens.toml`.
#
# Deliberately not a `test:*` / `ci:*` task. It builds in release mode and
# walks the whole workspace, which is too slow for the inner loop, and its
# value is a report a human or an agent reads — there is no assertion to
# gate a merge on. What it *does* catch, and no unit test can, is an
# analyzer that still returns `Ok` while saying something absurd about
# code the maintainers know by heart.
#
# Every profile has to exit 0: an analyzer that panics, or that rejects a
# profile the config schema says is valid, fails the run.
[tasks.selftest]
description = "Run agent-lens over its own sources (all agent-lens.toml profiles)"
usage = '''
arg "[profile]" help="Run only this profile instead of every one" default=""
flag "--format <format>" help="Report format: md (default) or json" default="md"
flag "--out <dir>" help="Write one report per profile here instead of stdout"
'''
run = '''
set -eu
format="${usage_format:-md}"
out="${usage_out:-}"
cargo build --release --locked
bin="$(cargo metadata --format-version 1 --no-deps \
  | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')/release/agent-lens"

if [ -n "${usage_profile:-}" ]; then
  profiles="$usage_profile"
else
  # The profile list comes from the config itself, so a profile added to
  # agent-lens.toml is covered without touching this task.
  profiles="$(sed -n 's/^\[profile\.\([a-z0-9-]*\)\]$/\1/p' agent-lens.toml)"
fi

[ -n "$out" ] && mkdir -p "$out"
for profile in $profiles; do
  echo "==> agent-lens run $profile --format $format" >&2
  if [ -n "$out" ]; then
    "$bin" run "$profile" --format "$format" > "$out/$profile.$format"
  else
    "$bin" run "$profile" --format "$format"
  fi
done
'''
