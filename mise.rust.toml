[tools]
rust = { version = "1.97.1", profile = "default", components = "rustfmt,clippy,llvm-tools-preview" }
"aqua:cargo-bins/cargo-binstall" = "1.18.1"

[tools."cargo:cargo-nextest"]
version = "0.9.132"
depends = ["aqua:cargo-bins/cargo-binstall"]

[tools."cargo:cargo-deny"]
version = "0.19.0"
depends = ["aqua:cargo-bins/cargo-binstall"]

[tools."cargo:cargo-audit"]
version = "0.22.1"
depends = ["aqua:cargo-bins/cargo-binstall"]

[tools."cargo:cargo-mutants"]
version = "27.0.0"
depends = ["aqua:cargo-bins/cargo-binstall"]

[tools."cargo:cargo-llvm-cov"]
version = "0.6.21"
depends = ["aqua:cargo-bins/cargo-binstall"]

[tasks."fmt:rust"]
description = "Format Rust code with cargo fmt"
run = "cargo fmt --all"

[tasks."lint:rust"]
description = "Lint Rust with clippy, fmt check, cargo-deny, cargo-audit"
run = [
  "cargo clippy --all-targets --all-features -- -D warnings",
  "cargo fmt --all --check",
  "cargo deny check",
  "cargo audit",
]

[tasks."test:rust"]
description = "Run Rust tests with cargo-nextest"
run = "cargo nextest run --locked --all-features"

[tasks."test:rust:doc"]
description = "Run Rust doctests (cargo-nextest does not run them)"
run = "cargo test --doc --locked --all-features --workspace"

[tasks."bench:rust"]
description = "Run the Criterion benchmarks; save or compare a named baseline"
usage = '''
flag "--save-baseline <name>" help="Store this run under a Criterion baseline name (convention: 'base' before a change, 'change' after)"
flag "--baseline <name>" help="Compare this run against a previously saved Criterion baseline"
'''
run = '''
set -eu
set --
if [ -n "${usage_save_baseline:-}" ]; then
  set -- "$@" --save-baseline "$usage_save_baseline"
fi
if [ -n "${usage_baseline:-}" ]; then
  set -- "$@" --baseline "$usage_baseline"
fi
cargo bench --workspace --all-features --bench '*' -- "$@"
'''

# Regression gate over the Criterion benchmarks: `ref` and the working tree run
# back to back and the task fails when a benchmark slowed down past
# `--threshold` (see `scripts/bench-compare.sh`). Not a `bench:*` task, since
# `mise run bench` would then pull it in; `bench-compare.yml` runs it on PRs.
[tasks.bench-compare]
description = "Benchmark a git ref against the working tree and fail on a regression"
usage = '''
arg "[ref]" help="Git ref to compare the working tree against" default="main"
flag "--threshold <percent>" help="Slowdown in percent (lower 95% CI bound of the mean change) that fails the task" default="20"
'''
run = 'scripts/bench-compare.sh "${usage_ref:-main}" "${usage_threshold:-20}"'

# Lives here rather than in `.mise.toml` so it resolves only where its dependency
# does, and is not a `mutants:*` glob: that would also pull in the diff-scoped
# run, which is the task you want on its own during normal development.
[tasks.mutants]
description = "Run the full-workspace mutation test (slow; not part of ci)"
depends = "mutants:rust"

[tasks."mutants:rust"]
description = "Run cargo-mutants across the whole workspace (very slow; not part of ci)"
usage = '''
flag "-j --jobs <jobs>" help="Number of cargo-mutants jobs to run in parallel" default="2"
'''
run = '''
set -eu
jobs="${usage_jobs:-2}"
case "$jobs" in
  ''|*[!0-9]*|0)
    echo "--jobs must be a positive integer."
    exit 1
    ;;
esac
cargo mutants --workspace --no-shuffle --jobs "$jobs"
'''

[tasks."mutants:rust:diff"]
description = "Run cargo-mutants only on Rust lines changed vs a base git ref (default: main)"
usage = '''
arg "[base]" help="Base git ref or revspec for git diff" default="main"
flag "-j --jobs <jobs>" help="Number of cargo-mutants jobs to run in parallel" default="2"
'''
run = '''
set -eu
base="${usage_base:-main}"
jobs="${usage_jobs:-2}"
case "$jobs" in
  ''|*[!0-9]*|0)
    echo "--jobs must be a positive integer."
    exit 1
    ;;
esac
if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
  if git rev-parse --verify "origin/$base" >/dev/null 2>&1; then
    base="origin/$base"
  elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
    base="HEAD~1"
  else
    echo "Could not resolve base ref '$base' (or origin/$base) and no HEAD~1 exists."
    exit 1
  fi
fi
mkdir -p target
git diff "$base" -- '*.rs' > target/mutants-diff.patch
if [ ! -s target/mutants-diff.patch ]; then
  echo "No Rust diff for cargo-mutants (base: $base)"
  exit 0
fi
echo "Running cargo-mutants against diff base: $base"
cargo mutants --workspace --no-shuffle --iterate --jobs "$jobs" --in-diff target/mutants-diff.patch
'''

# Not `mutants:rust:*`: a whole package's mutation run plus one coverage run
# per test, far slower than the diff-scoped run.
[tasks."mutants:minimize"]
description = "Report a package's redundant tests with mutrim (cargo-mutants kills + per-test coverage; slow, needs mutrim on PATH)"
usage = '''
arg "<package>" help="Workspace package whose tests to minimize, e.g. lens-golang"
flag "-j --jobs <jobs>" help="Number of cargo-mutants jobs to run in parallel" default="2"
'''
run = 'scripts/mutants-minimize.sh "$usage_package" "${usage_jobs:-2}"'

[tasks."test:callgraph-accuracy"]
description = "Unit-test the call-graph accuracy scorer and the Python and Rust oracles (scripts/callgraph-accuracy)"
# The oracle tests run pytest under the profiler; uv supplies it (they skip
# without pytest). uv is declared here because ci_rust.yml sets MISE_ENV=rust.
tools = { uv = "0.11.5" }
# `ruff check` (default rules) is the harness's only Python lint gate; the Go
# oracle's gofmt / vet / tests and the TypeScript oracle's `npm test` run by
# hand (see their READMEs), since this task runs with MISE_ENV=rust, which has
# no Go or Node toolchain. The Rust oracle's end-to-end test skips unless the
# rust-analyzer component is installed.
run = [
  "uvx ruff@0.14.0 check scripts/callgraph-accuracy",
  "uv run --no-project --python 3.12 --with pytest==8.4.2 python -m unittest discover -s scripts/callgraph-accuracy",
]

[tasks."ci:rust"]
description = "Run Rust lint and test tasks"
depends = ["lint:rust", "test:rust", "test:rust:doc", "test:callgraph-accuracy"]

# Call-graph accuracy benchmark (issue #579, docs/callgraph-accuracy.md):
# precision/recall of `function-graph` per ResolutionMethod against a Go
# go/callgraph/vta oracle, a Python sys.setprofile oracle, a rust-analyzer
# oracle and a TypeScript type-checker oracle on the pinned projects in
# scripts/callgraph-accuracy/targets.toml.
#
# Deliberately not a `ci:*` / `test:*` / `bench:*` task, like `bench`: it
# clones third-party repositories, downloads Go modules and PyPI packages,
# and runs their test suites under a profiler (minutes, network required),
# and its output is a report to read, not a pass/fail gate. The scorer's own
# unit tests are `test:callgraph-accuracy`, which `ci:rust` runs; the
# metamorphic resolver tests are ordinary cargo tests.
[tasks.callgraph-accuracy]
description = "Measure call-graph precision/recall against Go (VTA), Python (setprofile), Rust (rust-analyzer) and TypeScript (tsc) oracles"
usage = '''
arg "[target]..." help="Targets from scripts/callgraph-accuracy/targets.toml (default: all)" var=#true
'''
# go for the VTA oracle, uv for the Python targets' venvs (uv is also a base tool,
# but this task must work with MISE_ENV=rust alone), node for the TypeScript
# oracle; rust-analyzer is the toolchain's rustup component.
tools = { go = "1.26.8", uv = "0.11.5", node = "25.9.0" }
run = '''
set -eu
rustup component add rust-analyzer
cargo build --release --locked -p agent-lens
python3 scripts/callgraph-accuracy/run.py ${usage_target:-}
'''

# Dogfooding: run the freshly built binary over this repository's own
# sources, driving the profiles in `agent-lens.toml`.
#
# Deliberately not a `test:*` / `ci:*` task. It builds in release mode and
# walks the whole workspace, which is too slow for the inner loop, and its
# value is a report a human or an agent reads — there is no assertion to
# gate a merge on. What it *does* catch, and no unit test can, is an
# analyzer that still returns `Ok` while saying something absurd about
# code the maintainers know by heart.
#
# Every profile has to exit 0: an analyzer that panics, or that rejects a
# profile the config schema says is valid, fails the run.
[tasks.selftest]
description = "Run agent-lens over its own sources (all agent-lens.toml profiles)"
usage = '''
arg "[profile]" help="Run only this profile instead of every one" default=""
flag "--format <format>" help="Report format: md (default) or json" default="md"
flag "--out <dir>" help="Write one report per profile here instead of stdout"
'''
run = '''
set -eu
format="${usage_format:-md}"
out="${usage_out:-}"
cargo build --release --locked
bin="$(cargo metadata --format-version 1 --no-deps \
  | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')/release/agent-lens"

if [ -n "${usage_profile:-}" ]; then
  profiles="$usage_profile"
else
  # The profile list comes from the config itself, so a profile added to
  # agent-lens.toml is covered without touching this task.
  profiles="$(sed -n 's/^\[profile\.\([A-Za-z0-9_-]*\)\]$/\1/p' agent-lens.toml)"
fi

if [ -n "$out" ]; then
  mkdir -p "$out"
fi
for profile in $profiles; do
  echo "==> agent-lens run $profile --format $format" >&2
  if [ -n "$out" ]; then
    "$bin" run "$profile" --format "$format" > "$out/$profile.$format"
  else
    "$bin" run "$profile" --format "$format"
  fi
done
'''
