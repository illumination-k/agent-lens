name: Mutation Tests

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/mutants.toml"
      - ".mise.toml"
      - "mise.rust.toml"
      - "mise.base.toml"
      - ".github/workflows/mutants.yml"
  workflow_dispatch:

jobs:
  pr-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # cargo-mutants runs serially here (--in-place cannot parallelize),
    # so the budget scales with diff size: a large PR carries hundreds
    # of mutants at roughly 20-30s each on this runner. 60 minutes was
    # first exceeded by a ~260-mutant diff; cargo-mutants' own per-mutant
    # timeouts bound a hang, so a generous ceiling only costs runner
    # time on PRs that genuinely need it.
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      MISE_ENV: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run baseline tests
        run: mise run test:rust

      - name: Run cargo-mutants on PR diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "${BASE_REF}"
          mkdir -p target
          git diff "origin/${BASE_REF}"...HEAD -- '*.rs' > target/mutants-pr.diff
          if [ ! -s target/mutants-pr.diff ]; then
            echo "No Rust diff for cargo-mutants"
            exit 0
          fi
          cargo mutants --workspace --no-shuffle -vV --baseline=skip --in-place --in-diff target/mutants-pr.diff

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-pr-report
          path: mutants.out
          if-no-files-found: ignore

  full-baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENV: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run baseline tests
        run: mise run test:rust

  full-shard:
    if: github.event_name == 'workflow_dispatch'
    needs: full-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENV: rust
    strategy:
      fail-fast: false
      # cargo-mutants' GitHub Actions sharding example uses 8 shards. Keep the
      # same denominator for the manual full run so each shard stays comfortably
      # below the job timeout while avoiding more runner fan-out than the docs'
      # baseline example.
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run cargo-mutants full shard
        run: cargo mutants --workspace --no-shuffle -vV --baseline=skip --in-place --shard "${{ matrix.shard }}/8"

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-full-shard-${{ matrix.shard }}-of-8
          path: mutants.out
          if-no-files-found: ignore
