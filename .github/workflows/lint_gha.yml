name: Lint GHA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "mise.base.toml"
      - ".github/workflows/lint_gha.yml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "mise.base.toml"
      - ".github/workflows/lint_gha.yml"

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      MISE_ENV: base
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0

      - name: lint with mise
        run: mise run lint:gha
