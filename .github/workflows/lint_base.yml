name: Lint Base

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"
  pull_request:
    paths-ignore:
      - ".github/workflows/**"

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      MISE_ENV: base
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Run pre-commit
        run: prek run --all-files

      - name: lint with mise
        run: mise run lint:base
