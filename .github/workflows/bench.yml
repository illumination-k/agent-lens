name: Benchmarks

# Runs the Criterion benchmarks on the PR's base and head back to back on one
# runner and fails when a benchmark slowed down past the threshold. See
# `scripts/bench-compare.sh` for how a regression is decided.
on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "mise.rust.toml"
      - "scripts/bench-compare.sh"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    # Two release builds plus two full benchmark runs.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MISE_ENV: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Compare benchmarks against the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          git fetch origin "${BASE_REF}"
          mise run bench-compare "origin/${BASE_REF}"

      - name: Upload Criterion reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-compare
          path: |
            target/criterion-compare
            target/bench-compare.md
          if-no-files-found: ignore
