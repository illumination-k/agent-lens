name: Benchmarks

# Runs the Criterion benchmarks on the PR's base and head back to back on one
# runner and fails when a benchmark slowed down past the threshold. See
# `scripts/bench-compare.sh` for how a regression is decided.
on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "mise.rust.toml"
      - "scripts/bench-compare.sh"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    # Two release builds plus two full benchmark runs.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MISE_ENV: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Compare benchmarks against the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          git fetch origin "${BASE_REF}"
          mise run bench-compare "origin/${BASE_REF}"

      - name: Upload Criterion reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-compare
          path: |
            target/criterion-compare
            target/bench-compare.md
          if-no-files-found: ignore
