name: CI TypeScript

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "mise.ts.toml"
      - "mise.base.toml"
      - ".github/workflows/ci_ts.yml"
  pull_request:
    paths:
      - "web/**"
      - "mise.ts.toml"
      - "mise.base.toml"
      - ".github/workflows/ci_ts.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MISE_ENV: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      # mise-action caches the tools it installs (node, pnpm), not the packages
      # they download. Without the two steps below every run re-fetches the
      # whole dependency tree, the way the Rust job would without rust-cache.
      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "${GITHUB_ENV}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # `ci:ts` installs the web dependencies itself via the `install:ts` task
      # dependency, so there is no separate install step to keep in sync. It
      # also runs `build:ts`, so a PR that breaks the TanStack Start build (or
      # its `failOnError` prerender) fails here instead of on the Pages deploy.
      - name: CI
        run: mise run ci:ts

      # Mirrors the Rust job: `ci:ts` gates the build, then a separate
      # instrumented run produces the report so the fast lane stays
      # uninstrumented.
      - name: Generate coverage report
        run: mise run test:ts:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: web/coverage/lcov.info
          flags: web
          fail_ci_if_error: true
          verbose: true
