name: CI TypeScript

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "mise.ts.toml"
      - "mise.base.toml"
      - ".github/workflows/ci_ts.yml"
  pull_request:
    paths:
      - "web/**"
      - "mise.ts.toml"
      - "mise.base.toml"
      - ".github/workflows/ci_ts.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MISE_ENV: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      # `ci:ts` installs the web dependencies itself via the `install:ts` task
      # dependency, so there is no separate install step to keep in sync.
      - name: CI
        run: mise run ci:ts

      # Mirrors the Rust job: `ci:ts` gates the build, then a separate
      # instrumented run produces the report so the fast lane stays
      # uninstrumented.
      - name: Generate coverage report
        run: mise run test:ts:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: web/coverage/lcov.info
          flags: web
          fail_ci_if_error: true
          verbose: true
