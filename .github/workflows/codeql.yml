name: CodeQL Analysis

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "web/**"
      - "mise.rust.toml"
      - "mise.ts.toml"
      - "mise.base.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "web/**"
      - "mise.rust.toml"
      - "mise.ts.toml"
      - "mise.base.toml"
      - ".github/workflows/**"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Spelled out rather than left to autodetection: the set analysed then
      # stops depending on how much of each language happens to be checked in,
      # and `web/` (javascript-typescript) plus the workflows themselves
      # (actions) are scanned as deliberately as the crates are. Autodetection
      # already resolved to these three; none of them needs a build, which is
      # why the autobuild step below is a no-op the analysis does not rely on.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: rust,javascript-typescript,actions

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
