name: Release (rolling)

# Rolling prerelease from `main`. The `paths` filter is safe here because this
# workflow only ever handles branch pushes; tag releases live in
# `release-tag.yml`, which carries no filter.
on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "mise.rust.toml"
      - "mise.base.toml"
      - "README.md"
      - "install.sh"
      - ".github/workflows/release-latest.yml"
      - ".github/workflows/release-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
