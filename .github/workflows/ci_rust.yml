name: CI Rust

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "deny.toml"
      - "mise.rust.toml"
      - "mise.base.toml"
      - ".github/workflows/ci_rust.yml"
      - "scripts/callgraph-accuracy/**"
      - "scripts/similarity-accuracy/**"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "deny.toml"
      - "mise.rust.toml"
      - "mise.base.toml"
      - ".github/workflows/ci_rust.yml"
      - "scripts/callgraph-accuracy/**"
      - "scripts/similarity-accuracy/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      MISE_ENV: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      # No explicit `rustup component add` step: mise.rust.toml pins an exact
      # toolchain and declares `components = "rustfmt,clippy,llvm-tools-preview"`,
      # which mise installs with the toolchain. The workaround this replaces was
      # written for `version = "latest"`, which the manifest no longer uses.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked --workspace --all-features

      - name: CI
        run: mise run ci:rust

      - name: Generate coverage report
        run: cargo llvm-cov nextest --locked --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: lcov.info
          flags: rust
          fail_ci_if_error: true
          verbose: true
