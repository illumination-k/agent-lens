name: CI Rust

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "deny.toml"
      - "mise.rust.toml"
      - "mise.base.toml"
      - ".github/workflows/ci_rust.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "deny.toml"
      - "mise.rust.toml"
      - "mise.base.toml"
      - ".github/workflows/ci_rust.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      MISE_ENV: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      # mise's rust plugin doesn't reliably honour the `components`
      # setting in mise.rust.toml when `version = "latest"` resolves to a
      # toolchain rustup hasn't seen before, so install them explicitly.
      - name: Ensure Rust components
        run: rustup component add clippy rustfmt llvm-tools-preview

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Build
        run: cargo build --locked --workspace --all-features

      - name: CI
        run: mise run ci:rust

      - name: Generate coverage report
        run: cargo llvm-cov nextest --locked --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: lcov.info
          flags: rust
          fail_ci_if_error: true
          verbose: true
