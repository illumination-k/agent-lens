name: Nix

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - ".github/workflows/nix.yml"
  # nixpkgs moves under the flake even when this repo is idle; a weekly run
  # catches breakage before someone hits it with `nix run`.
  schedule:
    - cron: "17 4 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # Builds packages.default (which runs the full workspace test suite in
      # the sandbox) and evaluates devShells and the overlay.
      - name: Flake check
        run: nix flake check --print-build-logs

      - name: Smoke-test the built binary
        run: nix run . -- --version
