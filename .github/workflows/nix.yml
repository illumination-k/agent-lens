name: Nix

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - ".github/workflows/nix.yml"
  # nixpkgs moves under the flake even when this repo is idle; a weekly run
  # catches breakage before someone hits it with `nix run`.
  schedule:
    - cron: "17 4 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      # Builds packages.default (which runs the full workspace test suite in
      # the sandbox) and evaluates devShells and the overlay.
      - name: Flake check
        run: nix flake check --print-build-logs

      - name: Smoke-test the built binary
        run: nix run . -- --version
