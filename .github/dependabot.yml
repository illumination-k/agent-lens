version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # oxc crates share a single oxc_syntax version; they must be bumped
      # together or the workspace fails to compile (duplicate ScopeFlags).
      oxc:
        patterns:
          - "oxc_*"
      # ruff crates are pinned to one git tag and must move in lockstep.
      ruff:
        patterns:
          - "ruff_*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
