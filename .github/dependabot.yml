version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # `codeql.yml` pins init / autobuild / analyze to one SHA, and CodeQL
      # refuses to run when they disagree — a per-action PR bumps one of the
      # three and fails with "CodeQL job status was configuration error",
      # which is what happened to #393 / #398 / #402. Grouping them means one
      # PR carries all the pins at once. `upload-sarif` (used by `trivy.yml`)
      # is in the same group because it ships from the same action repo.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Everything else rides one weekly PR. Listed after `codeql-action`
      # because Dependabot assigns each dependency to the first group it
      # matches.
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # oxc crates share a single oxc_syntax version; they must be bumped
      # together or the workspace fails to compile (duplicate ScopeFlags).
      oxc:
        patterns:
          - "oxc_*"
      # ruff crates are pinned to one git tag and must move in lockstep.
      ruff:
        patterns:
          - "ruff_*"
      # Remaining minor / patch bumps share one weekly PR. Majors stay as
      # individual PRs since they are the ones likely to need code changes.
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # Minor / patch bumps share one weekly PR; majors stay individual.
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
